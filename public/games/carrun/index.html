<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Car Game | OpenSourceCodes</title>

    <link href="/assets/font/press_start_font.css" rel="stylesheet">
    <link href="/assets/cargame/style.css" rel="stylesheet">
</head>

<body>
    <div class="game-container" id="gameContainer">

        <!-- Top bar: pause + mute -->
        <div class="top-bar">
            <button class="pause-btn hidden" id="pauseBtn" aria-label="Pause">⏸</button>
            <button class="mute-btn" id="muteBtn" aria-label="Toggle sound">🔊</button>
        </div>

        <!-- HUD (sits below top bar) -->
        <div class="hud" id="hud">
            <div class="hud-chip">
                <span>SCORE</span>
                <div class="hud-score" id="scoreDisplay">0</div>
            </div>
            <div class="hud-chip">
                <span>LEVEL</span>
                <div class="hud-level" id="levelDisplay">1</div>
            </div>
            <div class="hud-chip">
                <span>BEST</span>
                <div class="hud-hiscore" id="highScoreDisplay">0</div>
            </div>
        </div>

        <!-- Level-up flash -->
        <div class="levelup-flash" id="levelupFlash"></div>

        <!-- Crash flash -->
        <div class="crash-flash" id="crashFlash"></div>

        <!-- Game area (road, cars rendered here) -->
        <div class="game-area" id="gameArea"></div>

        <!-- Touch controls -->
        <div class="touch-controls" id="touchControls">
            <button class="touch-btn" id="touchLeft" aria-label="Move left">◀</button>
            <button class="touch-btn" id="touchRight" aria-label="Move right">▶</button>
        </div>

        <!-- Start Screen -->
        <div class="overlay" id="startScreen">
            <h1 class="overlay-title">CAR DODGER</h1>
            <p class="overlay-subtitle">
                Dodge the traffic!<br>
                ← → Arrow Keys or Touch<br>
                Tap <strong>P</strong> to pause<br>
                Speed increases each level
            </p>
            <button class="btn btn-primary" id="startBtn">▶ Start Game</button>
        </div>

        <!-- End Screen -->
        <div class="overlay hidden" id="endScreen">
            <h1 class="overlay-title danger">GAME OVER</h1>
            <div class="new-highscore-badge hidden" id="newHighScoreBadge">🏆 New High Score!</div>
            <p class="overlay-stat">Score &nbsp;<strong id="finalScore">0</strong></p>
            <p class="overlay-stat">Level Reached &nbsp;<strong id="finalLevel">1</strong></p>
            <p class="overlay-stat">Best &nbsp;<strong id="finalBest">0</strong></p>
            <button class="btn btn-primary" id="restartBtn" style="margin-top:20px;">↺ Play Again</button>
        </div>

        <!-- Pause Screen -->
        <div class="pause-overlay hidden" id="pauseScreen">
            <h2>PAUSED</h2>
            <button class="btn btn-primary" id="resumeBtn">▶ Resume</button>
            <button class="btn btn-secondary" id="quitBtn">✕ Quit</button>
        </div>

    </div>
    <script src="/assets/libs/jquery/index.js"></script>
    <script src="/assets/libs/tone/index.js"></script>
    <script src="/assets/cargame/script.js"></script>
</body>

</html>
