<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors | OpenSourceCodes</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/rps/style.css">
</head>
<body>

<header>
  <div class="logo">RPS<span>//</span>ARENA</div>
</header>

<!-- Difficulty -->
<div class="difficulty-bar">
  <span class="diff-label">AI Mode</span>
  <button class="diff-btn active-easy" data-diff="easy">EASY</button>
  <button class="diff-btn" data-diff="medium">MEDIUM</button>
  <button class="diff-btn" data-diff="hard">HARD</button>
</div>

<!-- Scoreboard -->
<div class="scoreboard">
  <div class="score-side user">
    <div class="score-tag">YOU</div>
    <div class="score-num" id="user-score">0</div>
  </div>
  <div class="score-divider">:</div>
  <div class="score-side bot">
    <div class="score-tag">AI</div>
    <div class="score-num" id="bot-score">0</div>
  </div>
</div>

<!-- Result message -->
<div class="result-msg idle" id="result-msg">— MAKE YOUR MOVE —</div>

<!-- Arena hand displays -->
<div class="arena">
  <div class="arena-side">
    <div class="arena-label">You</div>
    <div class="hand-display user-hand" id="user-hand">✊</div>
  </div>
  <div class="vs-badge">VS</div>
  <div class="arena-side">
    <div class="arena-label">AI</div>
    <div class="hand-display bot-hand" id="bot-hand">
      <div class="ai-thinking" id="ai-thinking">
        <div class="think-dot"></div>
        <div class="think-dot"></div>
        <div class="think-dot"></div>
      </div>
      <span id="bot-emoji">✊</span>
    </div>
  </div>
</div>

<!-- Choice buttons -->
<div class="choices" id="choices">
  <button class="choice-btn" id="r">
    ✊ <span class="label">ROCK</span>
  </button>
  <button class="choice-btn" id="p">
    ✋ <span class="label">PAPER</span>
  </button>
  <button class="choice-btn" id="s">
    ✌️ <span class="label">SCISSORS</span>
  </button>
</div>

<!-- Actions -->
<div class="action-row">
  <button class="action-btn danger" id="reset">RESET</button>
  <button class="action-btn" id="toggle-alerts">ALERTS OFF</button>
</div>

<!-- Streak -->
<div class="streak-display" id="streak-display"></div>

<!-- History dots -->
<div class="history" id="history"></div>

<!-- Countdown overlay -->
<div class="countdown-overlay" id="countdown-overlay">
  <div class="countdown-num" id="countdown-num"></div>
</div>

 <script src="/assets/rps/script.js"></script>
</body>
</html>
